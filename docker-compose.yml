services:
  # ─────────────────────────────────────────────
  # Laravel App (FrankenPHP — servește HTTP)
  # ─────────────────────────────────────────────
  laravel_app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_learning_management_app
    restart: unless-stopped
    command: frankenphp run --config /var/www/html/Caddyfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      mongodb:
        condition: service_started
    environment:
      - APP_ENV=local
      - APP_NAME=Laravel
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=ai_learning_management
      - DB_USERNAME=ai_learning_management
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_CACHE_DB=1
      - DB_MONGO_HOST=mongodb
      - DB_MONGO_PORT=27017
      - DB_MONGO_DATABASE=ai_learning_management
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      - BROADCAST_CONNECTION=pusher
      - PUSHER_APP_ID=ai_learning_management
      - PUSHER_APP_KEY=ai_learning_management_key
      - PUSHER_APP_SECRET=ai_learning_management_secret
      - PUSHER_HOST=soketi
      - PUSHER_PORT=6001
      - PUSHER_SCHEME=http
      - VITE_PUSHER_HOST=localhost 
      - VITE_PUSHER_PORT=6001
      - VITE_PUSHER_SCHEME=http
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─────────────────────────────────────────────
  # Horizon Worker (procesare cozi)
  # ─────────────────────────────────────────────
  laravel_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_learning_management_worker
    restart: unless-stopped
    command: php artisan horizon
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - QUEUE_CONNECTION=redis
      - APP_ENV=local
      - APP_NAME=Laravel
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=ai_learning_management
      - DB_USERNAME=ai_learning_management
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_QUEUE=default
      - REDIS_CACHE_DB=1
      - DB_MONGO_HOST=mongodb
      - DB_MONGO_PORT=27017
      - DB_MONGO_DATABASE=ai_learning_management
      - ELASTICSEARCH_PORT=9200
      - BROADCAST_CONNECTION=pusher
      - PUSHER_APP_ID=ai_learning_management
      - PUSHER_APP_KEY=ai_learning_management_key
      - PUSHER_APP_SECRET=ai_learning_management_secret
      - PUSHER_HOST=soketi
      - PUSHER_PORT=6001
      - PUSHER_SCHEME=http
      - PUSHER_APP_CLUSTER=mt1
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200

  # ─────────────────────────────────────────────
  # Frontend (React + Vite)
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_learning_management_frontend
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_PUSHER_HOST=localhost
      - VITE_PUSHER_PORT=6001
      - VITE_PUSHER_SCHEME=http
    depends_on:
      - laravel_app

  # ─────────────────────────────────────────────
  # MySQL
  # ─────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: ai_learning_management_mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      - MYSQL_DATABASE=ai_learning_management
      - MYSQL_USER=ai_learning_management
      - MYSQL_PASSWORD=secret
      - MYSQL_ROOT_PASSWORD=root_secret
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-proot_secret"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─────────────────────────────────────────────
  # MongoDB
  # ─────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: ai_learning_management_mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db

  # ─────────────────────────────────────────────
  # Redis
  # ─────────────────────────────────────────────
  redis:
    image: redis:7
    container_name: ai_learning_management_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  # ─────────────────────────────────────────────
  # Elasticsearch
  # ─────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.10
    container_name: ai_learning_management_elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - bootstrap.memory_lock=true
    ports:
      - "9200:9200"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - es_data:/usr/share/elasticsearch/data

  # ─────────────────────────────────────────────
  # Soketi (server WebSocket, compatibil Pusher)
  # ─────────────────────────────────────────────
  soketi:
    image: quay.io/soketi/soketi:1.6-16-alpine
    container_name: ai_learning_management_soketi
    restart: unless-stopped
    ports:
      - "6001:6001"
      - "9601:9601"
    environment:
      - SOKETI_DEBUG=1
      - SOKETI_DEFAULT_APP_ID=ai_learning_management
      - SOKETI_DEFAULT_APP_KEY=ai_learning_management_key
      - SOKETI_DEFAULT_APP_SECRET=ai_learning_management_secret

  # ─────────────────────────────────────────────
  # Prometheus
  # ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: ai_learning_management_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - laravel_app

  # ─────────────────────────────────────────────
  # Grafana
  # ─────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: ai_learning_management_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # ─────────────────────────────────────────────
  # phpMyAdmin
  # ─────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ai_learning_management_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ai_learning_management
      PMA_PASSWORD: secret
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  mongodb_data:
  redis_data:
  es_data:
  grafana_data:
  backend_vendor:
  frontend_node_modules: